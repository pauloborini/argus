name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          cd node_modules/rolldown && npm install @rolldown/binding-linux-x64-gnu --no-save --no-package-lock
          cd "$GITHUB_WORKSPACE/node_modules/@parcel/watcher" && npm install @parcel/watcher-linux-x64-glibc --no-save --no-package-lock
      - run: npm run validate
      - run: npm run smoke:package
      - run: npm run release:check
      - name: Build release assets
        run: |
          mkdir -p dist-release
          npm pack --workspace=argus --pack-destination dist-release
          (cd dist-release && shasum -a 256 *.tgz > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist-release/* --generate-notes --verify-tag
