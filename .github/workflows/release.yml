name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run validate
      - run: npm run smoke:package
      - run: npm run release:check
      - run: npm install --global npm@latest
      - name: Build release assets
        run: |
          mkdir -p dist-release
          npm pack --workspace=atlas-cortex --pack-destination dist-release
          (cd dist-release && shasum -a 256 *.tgz > SHA256SUMS)
      - name: Publish npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace=atlas-cortex --access public --provenance
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist-release/* --generate-notes --verify-tag
