name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v2.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: |
          cd node_modules/rolldown && npm install @rolldown/binding-linux-x64-gnu --no-save --no-package-lock
          cd "$GITHUB_WORKSPACE/node_modules/@parcel/watcher" && npm install @parcel/watcher-linux-x64-glibc --no-save --no-package-lock
      - run: npm run validate
      - run: npm run smoke:package
      - run: npm run release:check
      - name: Build release assets
        run: |
          mkdir -p dist-release
          npm pack --workspace=@owerride/argus --pack-destination dist-release
          (cd dist-release && shasum -a 256 *.tgz > SHA256SUMS)
      - name: Publish npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace=@owerride/argus --access public
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" dist-release/* --generate-notes --verify-tag
          fi
